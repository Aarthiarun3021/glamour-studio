<script>
(function() {
  var generatedOTP = '';
  var userPhone = '';

  function checkLogin() {
    var user = localStorage.getItem('aarthi_user');
    var loginScreen = document.getElementById('login-screen');
    var root = document.getElementById('root');
    if (!loginScreen || !root) return;
    if (user) {
      loginScreen.style.display = 'none';
      root.style.display = 'block';
    } else {
      loginScreen.style.display = 'flex';
      root.style.display = 'none';
    }
  }

  function sendOTP() {
    var phone = document.getElementById('mobile-input').value.replace(/\D/g, '');
    if (phone.length !== 10) {
      alert('Please enter a valid 10-digit mobile number');
      return;
    }
    userPhone = phone;
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('otp-phone').textContent = phone;
    document.getElementById('login-step-1').style.display = 'none';
    document.getElementById('login-step-2').style.display = 'block';
    setTimeout(function() {
      alert('Your OTP is: ' + generatedOTP);
    }, 400);
    var boxes = document.getElementById('otp-boxes').querySelectorAll('.otp-box');
    for (var i = 0; i < boxes.length; i++) {
      (function(idx) {
        boxes[idx].value = '';
        boxes[idx].oninput = function() {
          if (this.value.length === 1 && idx < boxes.length - 1) {
            boxes[idx + 1].focus();
          }
          if (this.value.length === 1 && idx === boxes.length - 1) {
            verifyOTP();
          }
        };
        boxes[idx].onkeydown = function(e) {
          if (e.key === 'Backspace' && this.value === '' && idx > 0) {
            boxes[idx - 1].focus();
          }
        };
      })(i);
    }
    boxes[0].focus();
  }

  function resendOTP() {
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
    setTimeout(function() {
      alert('New OTP: ' + generatedOTP);
    }, 400);
  }

  function verifyOTP() {
    var boxes = document.getElementById('otp-boxes').querySelectorAll('.otp-box');
    var entered = '';
    for (var i = 0; i < boxes.length; i++) {
      entered += boxes[i].value;
    }
    if (entered === generatedOTP) {
      localStorage.setItem('aarthi_user', JSON.stringify({ phone: userPhone, loggedIn: Date.now() }));
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('root').style.display = 'block';
    } else {
      alert('Invalid OTP. Please try again.');
      for (var j = 0; j < boxes.length; j++) {
        boxes[j].value = '';
      }
      boxes[0].focus();
    }
  }

  function logout() {
    if (confirm('Logout? Your data stays on this device.')) {
      localStorage.removeItem('aarthi_user');
      location.reload();
    }
  }

  function init() {
    var btnSend = document.getElementById('btn-send-otp');
    var btnVerify = document.getElementById('btn-verify-otp');
    var btnResend = document.getElementById('btn-resend-otp');
    var btnLogout = document.getElementById('btn-logout');
    var mobileInput = document.getElementById('mobile-input');

    if (btnSend) btnSend.addEventListener('click', sendOTP);
    if (btnVerify) btnVerify.addEventListener('click', verifyOTP);
    if (btnResend) btnResend.addEventListener('click', resendOTP);
    if (btnLogout) btnLogout.addEventListener('click', logout);
    if (mobileInput) {
      mobileInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendOTP();
      });
    }
    checkLogin();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

        // === CLIENTS PAGE (CRM) ===
    const ClientsPage = ({ bookings, packages, setView }) => {
      const clients = useMemo(() => {
        const map = {};
        bookings.forEach(b => {
          if (!map[b.clientName]) {
            map[b.clientName] = { name: b.clientName, phone: b.phone || '', email: b.email || '', bookings: [], totalSpend: 0, makeupCount: 0, jewelleryCount: 0, lastVisit: null };
          }
          const c = map[b.clientName];
          c.bookings.push(b);
          const pkg = packages.find(p => p.id === Number(b.packageId));
          const qty = Number(b.quantity) || 1;
          const extras = (b.extraItems || []).reduce((s, ei) => s + (ei.price * (ei.qty || 1)), 0);
          const amount = ((pkg?.price || 0) * qty) + extras;
          c.totalSpend += amount;
          if (pkg?.type === 'jewellery') c.jewelleryCount += qty;
          else c.makeupCount += qty;
          const d = b.date;
          if (!c.lastVisit || d > c.lastVisit) c.lastVisit = d;
        });
        return Object.values(map).sort((a, b) => b.totalSpend - a.totalSpend);
      }, [bookings, packages]);

      const [search, setSearch] = useState('');
      const filtered = clients.filter(c => c.name.toLowerCase().includes(search.toLowerCase()) || (c.phone && c.phone.includes(search)));

      return (
        <div className="flex-1 overflow-y-auto pb-20">

    // === AI INSIGHTS PAGE ===
    const InsightsPage = ({ bookings, packages, settings }) => {
      const today = new Date().toISOString().split('T')[0];

      const stats = useMemo(() => {
        const confirmed = bookings.filter(b => b.status === 'confirmed');
        const completed = bookings.filter(b => b.status === 'completed');
        const pending = bookings.filter(b => b.status === 'pending');
        const cancelled = bookings.filter(b => b.status === 'cancelled');
        const upcoming = bookings.filter(b => b.date >= today && b.status !== 'cancelled');
        const past = bookings.filter(b => b.date < today && b.status !== 'cancelled');

        const totalRevenue = [...confirmed, ...completed].reduce((sum, b) => {
          const pkg = packages.find(p => p.id === Number(b.packageId));
          return sum + (pkg ? pkg.price : 0);
        }, 0);

        const revenueByMonth = {};
        bookings.forEach(b => {
          if (b.status === 'cancelled') return;
          const month = b.date.slice(0, 7);
          const pkg = packages.find(p => p.id === Number(b.packageId));
          revenueByMonth[month] = (revenueByMonth[month] || 0) + (pkg ? pkg.price : 0);
        });

        const packageCounts = {};
        bookings.forEach(b => {
          if (b.status === 'cancelled') return;
          const pkg = packages.find(p => p.id === Number(b.packageId));
          if (pkg) packageCounts[pkg.name] = (packageCounts[pkg.name] || 0) + 1;
        });
        const topPackage = Object.entries(packageCounts).sort((a, b) => b[1] - a[1])[0];

        const clientVisits = {};
        bookings.forEach(b => {
          if (b.status === 'cancelled') return;
          clientVisits[b.clientName] = (clientVisits[b.clientName] || 0) + 1;
        });
        const repeatClients = Object.entries(clientVisits).filter(([_, count]) => count > 1);

        const next7Days = bookings.filter(b => {
          const diff = Math.ceil((new Date(b.date) - new Date(today)) / (1000 * 60 * 60 * 24));
          return diff >= 0 && diff <= 7 && b.status !== 'cancelled';
        });

        const busiestMonth = Object.entries(revenueByMonth).sort((a, b) => b[1] - a[1])[0];

        return { confirmed, completed, pending, cancelled, upcoming, past, totalRevenue, revenueByMonth, topPackage, repeatClients, next7Days, busiestMonth, clientVisits, packageCounts };
      }, [bookings, packages, today]);

      const monthNames = { '01': 'Jan', '02': 'Feb', '03': 'Mar', '04': 'Apr', '05': 'May', '06': 'Jun', '07': 'Jul', '08': 'Aug', '09': 'Sep', '10': 'Oct', '11': 'Nov', '12': 'Dec' };

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

            {/* Client Summary */}

                  {stats.next7Days.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time)).map(b => {
                    const pkg = packages.find(p => p.id === Number(b.packageId));

                  {formData.advanceRequired && (
                    <div className="pl-7">
                      <label className="block text-lg font-medium text-slate-900 mb-1.5">Advance Amount (%)</label>
                      <input type="number" min="0" max="100" value={formData.advancePercent} onChange={e => setFormData({...formData, advancePercent: Number(e.target.value)})} className="w-32 px-4 py-2.5 rounded-xl input-field bg-white text-lg" />
                    </div>
                  )}
                  <div>
                    <label className="block text-lg font-medium text-slate-900 mb-1.5">Currency</label>
                    <select value={formData.currency} onChange={e => setFormData({...formData, currency: e.target.value})} className="w-40 px-4 py-2.5 rounded-xl input-field bg-white text-lg">
                      <option value="INR">INR (₹)</option>
                      <option value="USD">USD ($)</option>
                      <option value="EUR">EUR (€)</option>
                      <option value="GBP">GBP (£)</option>
                    </select>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <button onClick={handleSave} className="btn-primary px-6 py-3 rounded-xl text-lg font-medium flex items-center gap-2">
                  <Icon name="save" size={14} /> Save Changes
                </button>
                {saved && (
                  <span className="text-lg text-mauve-700 font-medium flex items-center gap-1.5">
                    <Icon name="check-circle" size={14} /> Saved successfully
                  </span>
                )}
              </div>

              {/* Data Export & Import */}
              <div className="glass-card rounded-2xl p-6">
                <div className="flex items-center gap-3 mb-5">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: 'rgba(107, 70, 86, 0.12)' }}>
                    <Icon name="database" size={18} className="text-slate-800" />
                  </div>
                  <h3 className="font-display text-2xl font-semibold text-slate-950">Backup & Restore</h3>
                </div>
                <p className="text-lg text-slate-700 mb-5">Export your studio data as a file to share across devices, or import a previously saved backup.</p>
                <div className="flex flex-col sm:flex-row gap-4">
                  <button
                    onClick={() => {
                      const data = { packages, bookings, settings, exportedAt: new Date().toISOString() };
                      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `studio-backup-${new Date().toISOString().split('T')[0]}.json`;
                      a.click();
                      URL.revokeObjectURL(url);
                    }}
                    className="btn-primary px-6 py-3 rounded-xl text-lg font-medium flex items-center gap-2 flex-1 justify-center"
                  >
                    <Icon name="download" size={14} /> Export All Data
                  </button>
                  <label className="flex-1 cursor-pointer">
                    <input
                      type="file"
                      accept=".json"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (event) => {
                          try {
                            const data = JSON.parse(event.target.result);
                            if (data.packages) setPackages(data.packages);
                            if (data.bookings) setBookings(data.bookings);
                            if (data.settings) {
                              setSettings(data.settings);
                              setFormData(data.settings);
                            }
                            alert('Data imported successfully!');
                          } catch (err) {
                            alert('Invalid backup file. Please select a valid studio-backup JSON file.');
                          }
                        };
                        reader.readAsText(file);
                        e.target.value = '';
                      }}
                    />
                    <span className="block text-center px-6 py-3 rounded-xl text-lg font-medium btn-secondary flex items-center gap-2 justify-center hover:bg-mauve-100 transition-colors">
                      <Icon name="upload" size={14} /> Import Data
                    </span>
                  </label>
                </div>
              </div>
            </div>

            {/* Quick Info */}
            <div className="space-y-6">
              <div className="glass-card rounded-2xl p-6 text-center">
                <div className="w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl font-display font-bold" style={{ background: '#4a4a5a', color: '#e5d5dc' }}>
                  {formData.ownerName?.charAt(0) || 'A'}
                </div>
                <h4 className="font-display text-lg font-semibold text-slate-950">{formData.ownerName}</h4>
                <p className="text-lg text-slate-600">{formData.businessName}</p>
                <div className="mt-4 pt-4 border-t border-mauve-100 space-y-2 text-lg text-slate-700">
                  <p className="flex items-center gap-2 justify-center"><Icon name="phone" size={12} /> {formData.phone}</p>
                  <p className="flex items-center gap-2 justify-center"><Icon name="envelope" size={12} /> {formData.email}</p>
                  <p className="flex items-center gap-2 justify-center"><Icon name="map-marker-alt" size={12} /> {formData.address?.split(',')[0]}</p>
                </div>
              </div>

              <div className="glass-card rounded-2xl p-6">
                <h4 className="font-semibold text-slate-900 mb-3">Studio Hours</h4>
                <div className="space-y-2 text-lg">
                  <div className="flex justify-between text-slate-800">
                    <span>Mon - Sun</span>
                    <span className="font-medium">{formData.workingHours.start} - {formData.workingHours.end}</span>
                  </div>
                </div>
                <div className="mt-4 pt-4 border-t border-mauve-100">
                  <p className="text-lg text-slate-600">
                    {formData.advanceRequired
                      ? `Advance of ${formData.advancePercent}% required for all bookings.`
                      : "No advance payment required."}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // === MAIN APP ===
    const App = () => {
      const [currentView, setView] = useState('dashboard');
      const [packages, setPackages] = useLocalStorage('glamour-packages', initialPackages);
      const [bookings, setBookings] = useLocalStorage('glamour-bookings', initialBookings);
      const [settings, setSettings] = useLocalStorage('glamour-settings', initialSettings);

      return (
        <div className="min-h-screen flex" style={{ background: '#e5d5dc' }}>
          <Sidebar currentView={currentView} setView={setView} settings={settings} />
          <MobileHeader currentView={currentView} setView={setView} settings={settings} />
          <main className="flex-1 overflow-y-auto main-content" style={{ background: '#e5d5dc' }}>
            <div className="max-w-7xl mx-auto p-6 lg:p-8">
              {currentView === 'dashboard' && <Dashboard bookings={bookings} packages={packages} setView={setView} settings={settings} />}
              {currentView === 'packages' && <PackagesPage packages={packages} setPackages={setPackages} />}
              {currentView === 'clients' && <ClientsPage bookings={bookings} packages={packages} setView={setView} />}
              {currentView === 'calendar' && <CalendarPage bookings={bookings} setBookings={setBookings} packages={packages} setView={setView} settings={settings} />}
              {currentView === 'insights' && <InsightsPage bookings={bookings} packages={packages} settings={settings} />}
              {currentView === 'settings' && <SettingsPage settings={settings} setSettings={setSettings} packages={packages} bookings={bookings} setPackages={setPackages} setBookings={setBookings} />}
            </div>
          </main>
          
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
