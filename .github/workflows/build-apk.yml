name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install Capacitor Filesystem plugin
        run: |
          npm install @capacitor/filesystem@5.1.4
          npx cap sync

      - name: Set app name and icon
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Aarthi Makeover</string>
              <string name="title_activity_main">Aarthi Makeover</string>
          </resources>
          EOF
          if [ -f "app-icons.zip" ]; then
            unzip -o app-icons.zip -d android/app/src/main/res/
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aarthi-makeover-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
